[goal_desc]
feudal = "Reach Feudal as soon as possible without idling the TC. The base of almost every opening."
castle = "Skip the Feudal fight and reach Castle early (knights, monks, boom). Common on Arena and closed maps; on Arabia you must defend against rushes."
imperial = "Reach Imperial as fast as possible. Players usually idle the TC a few seconds to save gold."
drush = "\"Dark rush\": 3 militia in the Dark Age to harass enemy wood and gold while you go up to Feudal. Pros use it to delay the enemy economy and follow up with archers or a Fast Castle."
scouts = "Fast Feudal with scout cavalry to hit villagers on sheep, berries and wood. Very common on Arabia against weak defense."
archers_feudal = "Archery ranges in Feudal with Fletching: constant pressure on enemy wood and gold. An Arabia classic."
castle_drop = "Reach Castle with saved stone and build a castle near the enemy to deny resources. Needs a lot of stone (650) and stone miners from Feudal."
boom_3tc = "On reaching Castle build 2 more TCs and keep making villagers: more economy for the late game. Works if the enemy does not pressure."
villagers_30_feudal = "How many villagers you can have when reaching Feudal without idling the TC."
archers_20 = "An archer army with its attack upgrade."
knights_10 = "Castle Age knights: the classic hit after a Fast Castle."

