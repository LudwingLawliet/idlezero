# Arabia neutra (nivel 1): mapa abierto y plano con los recursos estándar de
# inicio. Sin elevación, sin enemigos, sin bonos de civilización.
# Cantidades según la Wiki de AoE; distancias, tiempos de llegada de las ovejas
# y de atracción de jabalíes = estimaciones propias, todas aproximadas hasta
# validarlas en partida.
#
# `pool` agrupa fuentes que las órdenes tratan como una sola ("sheep" = todas
# las ovejas). Dentro de un pool se recolecta en el orden de este archivo.
name = "Arabia neutra"
level = 1

[start]
villagers = 3
scouts = 1
town_centers = 1
source = "https://ageofempires.fandom.com/wiki/Resources_(Age_of_Empires_II)"
resources = { food = 200, wood = 200, gold = 100, stone = 200 }

# Casillas que camina un constructor hasta cada tipo de edificio (aproximado).
[build_walk_tiles]
default = 4.0
house = 4.0
farm = 2.0
mill = 8.0
lumber_camp = 10.0
mining_camp = 12.0
market = 6.0
blacksmith = 6.0

[[source]]
id = "sheep_start"
pool = "sheep"
task = "shepherd"
count = 4             # las 4 que empiezan junto al CU
amount = 100
distance_tiles = 1.0  # se recolectan bajo el CU
approximate = true

