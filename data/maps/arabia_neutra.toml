# Arabia neutra (nivel 1): mapa abierto y plano con los recursos estándar de
# inicio. Sin elevación, sin enemigos, sin bonos de civilización.
# Cantidades según la Wiki de AoE; distancias = promedio estimado en casillas.
# Todas las distancias son aproximadas hasta validarlas en partida.
name = "Arabia neutra"
level = 1

[start]
