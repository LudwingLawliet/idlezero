# Mejoras de combate que usa la pestaña Batalla (crates/aoe2-battle).
# Valores de AoE2 DE según la wiki de la comunidad (ageofempires.fandom.com,
# páginas de cada tecnología); los marcados `approximate` simplifican el efecto.
# Las mejoras de unidad (Ballestero, Caballero…) no van aquí: se usa la unidad
# mejorada directamente.
#
# applies: a quién afecta; cualquiera de
#   categories (infantry, archers, cav_archers, cavalry, siege, monks, ships),
#   units (ids), trained_at (edificio que la entrena), classes (de armadura).
# Efectos: melee_attack, pierce_attack, melee_armor, pierce_armor, range, hp,
#   hp_mult, reload_mult (>1 = ataca más rápido), speed_mult, accuracy (%).
schema_version = 1

