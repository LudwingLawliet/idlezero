# Objetivos y estrategias predefinidos. Los nombres y las explicaciones están
# en data/i18n (secciones goals y goal_desc). Un objetivo se cumple cuando
# todo lo pedido está. category: rush, fast (rápido a una edad), boom, units.
#
# Las estrategias calculan la ECONOMÍA necesaria para tener esas unidades o
# edificios a tiempo; el combate, la caminata hasta el rival y el micro no se
# simulan.

[[goal]]
id = "feudal"
category = "fast"
age = "Feudal"

[[goal]]
id = "castle"
category = "fast"
age = "Castle"

[[goal]]
id = "imperial"
category = "fast"
age = "Imperial"
allow_tc_idle = true   # para Imperial se suele parar el CU unos segundos y ahorrar

[[goal]]
id = "drush"
category = "rush"
age = "Feudal"
units = [{ unit = "militia", count = 3 }]

