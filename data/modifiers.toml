# Efectos económicos de las tecnologías, como datos.
# kind:
#   rate_mult   multiplica la tasa de recolección de las tareas `tasks`
#   carry_add   suma capacidad de carga a las tareas `tasks` (vacío = todas)
#   carry_mult  multiplica la capacidad de carga (todas las tareas)
#   speed_mult  multiplica la velocidad de los aldeanos
#   farm_food_add  suma comida a cada granja nueva o resembrada
# Escenario neutro: solo tecnologías, ningún bono de civilización.
schema_version = 1

