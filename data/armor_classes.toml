# Clases de ataque/armadura de AoE2 DE (ids de aoe2techtree,
# js/techtree.js -> attackAndArmorClasses), con nombre es/en.
# `shown = false`: clases base que no son "bonos" (perforante y cuerpo a cuerpo
# base, cuerpo a cuerpo que ignora armadura); no se muestran como counters.
schema_version = 1

[class]
