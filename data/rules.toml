# Reglas del juego que no vienen en aoe2techtree.
# Escenario neutro: sin bonos de civilización.
schema_version = 1

[population]
per_town_center = 5
per_house = 5
max = 200
source = "https://ageofempires.fandom.com/wiki/Population_(Age_of_Empires_II)"
approximate = false

[farm]
food = 175
auto_reseed = true
source = "https://ageofempires.fandom.com/wiki/Farm_(Age_of_Empires_II)"
approximate = false

# Para investigar una edad hacen falta `count` edificios distintos de la lista,
# terminados. Edad Feudal: 2 edificios de la Oscura; Castillos: 2 de la Feudal.
[[age_requirement]]
tech = 101      # Edad Feudal
count = 2
buildings = [12, 68, 562, 584, 45]   # Cuartel, Molino, Camp. maderero, Camp. minero, Puerto
source = "https://ageofempires.fandom.com/wiki/Feudal_Age_(Age_of_Empires_II)"
approximate = false

[[age_requirement]]
tech = 102      # Edad de los Castillos
count = 2
buildings = [103, 84, 87, 101]       # Herrería, Mercado, Galería de tiro, Establo
source = "https://ageofempires.fandom.com/wiki/Castle_Age_(Age_of_Empires_II)"
approximate = false

# Edad mínima para construir, cuando difiere del árbol de aoe2techtree: el CU
# figura en Edad Oscura (por el inicial), pero los CU adicionales necesitan
# la Edad de los Castillos en AoE2 DE (salvo bonos de civilización).
[building_age]
109 = "Castle"

# Tecnología previa que exige cada tecnología (aoe2techtree no lo incluye).
# Fuente: árbol tecnológico de AoE2 DE (líneas de herrería, económicas y otras).
[tech_requires]
200 = 199   # Flecha de punzón <- Emplumado
201 = 200   # Brazal <- Flecha de punzón
212 = 211   # Armadura de cuero (arq.) <- acolchada
219 = 212   # Armadura de anillas (arq.) <- de cuero
68 = 67     # Fundición <- Forja
75 = 68     # Alto horno <- Fundición
76 = 74     # Cota de malla <- Armadura de escamas
77 = 76     # Armadura de placas <- Cota de malla
82 = 81     # Barda de malla <- Barda de escamas
80 = 82     # Barda de placas <- Barda de malla
203 = 202   # Sierra de arco <- Hacha de doble filo
221 = 203   # Sierra a dos manos <- Sierra de arco
13 = 14     # Arado pesado <- Collera
12 = 13     # Rotación de cultivos <- Arado pesado
249 = 213   # Carro de mano <- Carretilla
182 = 55    # Minería de oro en pozo <- Minería de oro
279 = 278   # Minería de piedra en pozo <- Minería de piedra
280 = 8     # Patrulla urbana <- Guardia urbana
436 = 437   # Tácticas partas <- Anillo de arquero
17 = 23     # Banca <- Acuñación

# Tecnologías de edad: al terminar, el jugador pasa a la edad indicada.
[ages]
101 = "Feudal"
102 = "Castle"
103 = "Imperial"

# Nombres cortos para las órdenes de construcción (data/build_orders/).
[names.buildings]
town_center = 109
house = 70
mill = 68
lumber_camp = 562
mining_camp = 584
farm = 50
barracks = 12
market = 84
blacksmith = 103
archery_range = 87
stable = 101

[names.units]
villager = 83
militia = 74
spearman = 93
archer = 4
skirmisher = 7
crossbowman = 24
scout_cavalry = 448
knight = 38
cavalry_archer = 39
monk = 125

[names.techs]
loom = 22
feudal_age = 101
castle_age = 102
imperial_age = 103
double_bit_axe = 202
bow_saw = 203
horse_collar = 14
heavy_plow = 13
wheelbarrow = 213
hand_cart = 249
gold_mining = 55
stone_mining = 278
fletching = 199
