[package]
name = "idlezero"
description = "IdleZero"
authors = ["LudwingVanCat"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# El sufijo `_lib` evita choques de nombre con el binario en Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "idlezero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
aoe2-data.workspace = true
aoe2-sim = { path = "../../crates/aoe2-sim" }
aoe2-opt = { path = "../../crates/aoe2-opt" }
toml.workspace = true
