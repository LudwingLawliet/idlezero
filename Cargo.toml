[workspace]
resolver = "3"
members = ["crates/*", "tools/import", "app/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
aoe2-data = { path = "crates/aoe2-data" }

# Optimización del binario de la app (https://tauri.app/concept/size/).
# Sin UPX ni empaquetadores: los antivirus los marcan.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# El optimizador simula miles de variantes: también optimizado en desarrollo y tests.
[profile.dev.package.aoe2-sim]
opt-level = 2

[profile.dev.package.aoe2-opt]
opt-level = 2
